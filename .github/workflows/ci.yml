name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.46.0
          frozen: true
          cache: true

      - name: Lint and format check
        run: pixi run check

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Exit non-zero on errors (bad paths, type mismatches), zero on warnings.
      # Not --strict: the root CLAUDE.md is contributor context, and the
      # validator warns that plugins do not load it.
      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json

      - name: Validate marketplace manifest
        run: claude plugin validate .

  test-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.46.0
          frozen: true
          cache: true

      # Test the casatools that users get. On linux-64 that is the version in
      # pixi.lock (6.7.6.14), resolved by pixi alongside its own openssl; the
      # old step pip-installed 6.7.0.31 over it, so CI tested a version no user
      # ran. (6.7.0.31 was chosen because >=6.7.2 bundles a libldap.so.2 that
      # needs EVP_md2, which failed to import on Ubuntu when casatools was
      # pip-installed after activation; commit 1146093 fixed the plugin smoke
      # test by resolving it through the lock instead.) osx-arm64 has no
      # casatools in the lock, so install it with pip, as the plugin's
      # environment build does on macOS.
      - name: Install casatools and casatasks (macOS, as the plugin does)
        if: runner.os == 'macOS'
        run: pixi run pip install casatools casatasks

      - name: Import casatools
        # A failure here is a user-facing break, not a test problem: the
        # plugin ships this exact environment. mkdir in the same block as
        # pixi run, as below.
        run: |
          mkdir -p ~/.casa/data
          pixi run python -c "import casatools, casatasks; print('casatools', casatools.version_string())"

      - name: Run unit tests
        # mkdir must be in the same run block as pixi run: separate steps put
        # the dir and the test process in different uid namespaces.
        run: |
          mkdir -p ~/.casa/data
          pixi run test-unit
