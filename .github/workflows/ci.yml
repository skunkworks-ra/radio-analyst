name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.46.0
          frozen: true
          cache: true

      - name: Lint and format check
        run: pixi run check

  test-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.46.0
          frozen: true
          cache: true

      - name: Install casatools and casatasks
        # Pinned: casatools/casatasks >=6.7.2 bundle a libldap.so.2 that requires
        # EVP_md2 from OpenSSL <3.0. Ubuntu runners (and modern Fedora) ship
        # OpenSSL 3.x without it, so importing casatools fails with
        # "undefined symbol: EVP_md2, version OPENSSL_3.0.0". 6.7.0.31 does not
        # hit this. Re-test before bumping.
        run: pixi run pip install casatools==6.7.0.31 casatasks==6.7.0.31

      - name: Run unit tests
        # mkdir must be in the same run block as pixi run: separate steps put
        # the dir and the test process in different uid namespaces.
        run: |
          mkdir -p ~/.casa/data
          pixi run test-unit
