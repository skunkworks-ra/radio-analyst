name: Plugin CI

on:
  push:
    branches: [main, ci-setup]
  # PRs that can change how the plugin installs or starts. The paid LLM job
  # stays off PRs (see its `if`).
  pull_request:
    paths:
      - ".claude-plugin/**"
      - ".mcp.json"
      - "hooks/**"
      - "scripts/plugin/**"
      - "scripts/ci/**"
      - "pixi.toml"
      - "pixi.lock"
      - "pyproject.toml"
      - "docker/**"
      - ".github/workflows/plugin-ci.yml"
  workflow_dispatch:
    inputs:
      run_llm_layer:
        description: "Also run the LLM-driven tool probe (Layer 2, spends tokens)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/radio-analyst-ci

jobs:
  build-image:
    # A fork's PR token cannot push to GHCR; skip (and with it every job that
    # needs the image) rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-free:
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: pixi install
        run: pixi install --manifest-path pixi.toml

      - name: Prepare CASA measures data dir
        run: mkdir -p "$HOME/.casa/data"

      - name: Generate smoke MS
        run: pixi run --manifest-path pixi.toml python scripts/ci/generate_smoke_ms.py smoke.ms

      - name: Install plugin from this checkout (isolated HOME)
        run: |
          mkdir -p .scratch/ci-home
          export HOME="$PWD/.scratch/ci-home"
          claude plugin marketplace add ./
          claude plugin install radio-analyst@radio-analyst
          claude plugin list

      - name: Raw MCP handshake + tool call (no LLM, no tokens spent)
        run: pixi run --manifest-path pixi.toml python scripts/ci/mcp_smoke.py smoke.ms

  # The installed-plugin path (CLAUDE_PLUGIN_DATA set), which smoke-free does
  # not reach: SessionStart hook -> detached build under CLAUDE_PLUGIN_DATA ->
  # servers launched from the built env with pixi off PATH -> rebuild after a
  # source change. Real pixi, real casatools, no tokens.
  smoke-plugin-env:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ${{ needs.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Plugin environment end to end
        run: bash scripts/ci/plugin_env_smoke.sh smoke.ms

  smoke-llm:
    if: github.event_name != 'pull_request'
    needs: [build-image, smoke-free]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # No MCP_TIMEOUT override: the servers must start inside Claude Code's
      # default budget, as they do for users (the environment is built ahead
      # of the launch, not inside it).
    steps:
      - uses: actions/checkout@v5

      - name: pixi install
        run: pixi install --manifest-path pixi.toml

      - name: Prepare CASA measures data dir
        run: mkdir -p "$HOME/.casa/data"

      - name: Generate smoke MS
        run: pixi run --manifest-path pixi.toml python scripts/ci/generate_smoke_ms.py smoke.ms

      - name: Install plugin (isolated HOME)
        run: |
          mkdir -p .scratch/ci-home
          export HOME="$PWD/.scratch/ci-home"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.casa/data"
          claude plugin marketplace add ./
          claude plugin install radio-analyst@radio-analyst

      - name: Trust the workspace (non-interactive HOME never sees the trust dialog)
        run: pixi run --manifest-path pixi.toml python -c "import json, os; path = os.path.join(os.environ['HOME'], '.claude.json'); data = json.load(open(path)) if os.path.exists(path) else {}; data.setdefault('projects', {}).setdefault(os.getcwd(), {})['hasTrustDialogAccepted'] = True; json.dump(data, open(path, 'w'))"

      - name: Build the plugin environment as a user's first session does
        # `claude mcp list` launches the plugin's servers with
        # CLAUDE_PLUGIN_DATA set; the launcher starts the detached build. If
        # that started nothing, a one-line session runs the SessionStart hook.
        run: |
          DATA="$HOME/.claude/plugins/data"
          claude mcp list || true
          stamp=""
          for i in $(seq 1 180); do
            stamp="$(find "$DATA" -name env.stamp 2>/dev/null | head -n1)"
            [ -n "$stamp" ] && break
            if [ "$i" -eq 3 ] && ! find "$DATA" -name build.log 2>/dev/null | grep -q .; then
              echo "no build after 'claude mcp list'; starting a session to run the SessionStart hook"
              claude -p "Reply with OK." --model haiku > /dev/null || true
            fi
            sleep 10
          done
          find "$DATA" -name build.log -exec tail -n 40 {} \;
          [ -n "$stamp" ] || { echo "FAIL: the plugin environment was not built"; exit 1; }

      - name: Ask Claude to use the installed plugin end-to-end (billed to Pro subscription token)
        run: |
          claude -p "Use the ms_observation_info tool from the ms-inspect MCP server on the MS at $PWD/smoke.ms and report the telescope name it returns." \
            --model haiku \
            --allowed-tools "mcp__plugin_radio-analyst_ms-inspect__ms_observation_info" \
            --permission-prompts none \
            --output-format json \
            > llm_smoke_output.json
          cat llm_smoke_output.json
          grep -qi "VLA" llm_smoke_output.json

  # ---------------------------------------------------------------------
  # Manual-only: probe every registered MCP tool (53 across the 3 servers).
  # Layer 1 (raw MCP, no tokens) always runs on dispatch. Layer 2 (LLM-driven,
  # spends tokens) is opt-in via the run_llm_layer input.
  # ---------------------------------------------------------------------
  tool-probe-setup:
    if: github.event_name == 'workflow_dispatch'
    needs: build-image
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: gen
        run: |
          python3 -c "
          import json
          m = json.load(open('scripts/ci/tool_manifest.json'))['tools']
          pairs = [{'server': s, 'tool': t} for s, tools in m.items() for t in tools]
          print('matrix=' + json.dumps({'include': pairs}))
          " >> "$GITHUB_OUTPUT"

  tool-probe:
    if: github.event_name == 'workflow_dispatch'
    needs: [build-image, tool-probe-setup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tool-probe-setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: pixi install
        run: pixi install --manifest-path pixi.toml

      - name: Prepare CASA measures data dir
        run: mkdir -p "$HOME/.casa/data"

      - name: Generate smoke MS
        run: pixi run --manifest-path pixi.toml python scripts/ci/generate_smoke_ms.py smoke.ms

      - name: Probe ${{ matrix.tool }}
        run: |
          pixi run --manifest-path pixi.toml python scripts/ci/tool_probe.py \
            --server "${{ matrix.server }}" --tool "${{ matrix.tool }}" \
            --smoke-ms smoke.ms --out "results/${{ matrix.tool }}.layer1.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-probe-layer1-${{ matrix.tool }}
          path: results/${{ matrix.tool }}.layer1.json

  tool-probe-llm:
    if: github.event_name == 'workflow_dispatch' && inputs.run_llm_layer
    needs: [build-image, tool-probe-setup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      MCP_TIMEOUT: "120000"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tool-probe-setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: pixi install
        run: pixi install --manifest-path pixi.toml

      - name: Prepare CASA measures data dir
        run: mkdir -p "$HOME/.casa/data"

      - name: Generate smoke MS
        run: pixi run --manifest-path pixi.toml python scripts/ci/generate_smoke_ms.py smoke.ms

      - name: LLM-probe ${{ matrix.tool }}
        run: |
          pixi run --manifest-path pixi.toml python scripts/ci/tool_probe_llm.py \
            --server "${{ matrix.server }}" --tool "${{ matrix.tool }}" \
            --smoke-ms smoke.ms --out "results/${{ matrix.tool }}.layer2.json"
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-probe-layer2-${{ matrix.tool }}
          path: results/${{ matrix.tool }}.layer2.json

  tool-probe-report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [tool-probe, tool-probe-llm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: tool-probe-layer*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Merge into lookup-table report
        run: python3 scripts/ci/merge_tool_report.py --results-dir downloaded-artifacts --out tool_probe_report.csv

      - uses: actions/upload-artifact@v4
        with:
          name: tool-probe-report
          path: tool_probe_report.csv
